<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found | Monica Marine Nigeria</title>
<link rel="icon" type="image/jpeg" href="logo.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#060e1f;--navy2:#0a1628;--navy4:#112240;--navy5:#1B3A6B;
  --blue:#1a56db;--blue2:#2563eb;--blue3:#3b82f6;--blue4:#60a5fa;
  --cyan:#06b6d4;--white:#fff;
}
html,body{height:100%;font-family:'Inter',sans-serif;background:var(--navy);color:white;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:24px;position:relative}
.bg{position:fixed;inset:0;background:radial-gradient(ellipse at 30% 50%,rgba(37,99,235,0.15),transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(6,182,212,0.08),transparent 50%);z-index:0}
.grid{position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.02) 1px,transparent 1px);background-size:64px 64px;z-index:0}
.content{position:relative;z-index:1;max-width:540px}
.logo{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:48px}
.logo img{width:44px;height:44px;border-radius:8px;object-fit:contain;background:white;padding:3px}
.logo-name{font-family:'Montserrat',sans-serif;font-weight:800;font-size:16px;color:white}
.code{font-family:'Montserrat',sans-serif;font-weight:900;font-size:clamp(80px,15vw,140px);color:transparent;background:linear-gradient(135deg,var(--blue3),var(--cyan));-webkit-background-clip:text;background-clip:text;line-height:1;margin-bottom:16px;letter-spacing:-0.04em}
h1{font-family:'Montserrat',sans-serif;font-weight:800;font-size:clamp(20px,4vw,28px);color:white;margin-bottom:14px;letter-spacing:-0.02em}
p{font-size:15px;color:rgba(255,255,255,0.5);line-height:1.75;font-weight:300;margin-bottom:40px;max-width:400px;margin-left:auto;margin-right:auto}
.btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 28px;border-radius:8px;font-family:'Montserrat',sans-serif;font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;border:none;text-decoration:none;transition:all 0.3s ease}
.btn-primary{background:linear-gradient(135deg,var(--blue2),var(--blue));color:white;box-shadow:0 4px 20px rgba(37,99,235,0.4)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(37,99,235,0.5)}
.btn-outline{background:transparent;color:rgba(255,255,255,0.7);border:1.5px solid rgba(255,255,255,0.2)}
.btn-outline:hover{border-color:rgba(255,255,255,0.5);color:white;transform:translateY(-2px)}
.wave{position:fixed;bottom:0;left:0;right:0;z-index:0;opacity:0.3}
</style>
</head>
<body>
<div class="bg"></div>
<div class="grid"></div>
<div class="content">
  <div class="logo">
    <img src="logo.jpeg" alt="Monica Marine Logo">
    <span class="logo-name">Monica Marine</span>
  </div>
  <div class="code">404</div>
  <h1>Page Not Found</h1>
  <p>The page you're looking for has drifted off course. Let us help you navigate back to safer waters.</p>
  <div class="btns">
    <a href="/" class="btn btn-primary">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Back to Home
    </a>
    <a href="/#contact" class="btn btn-outline">Contact Us</a>
  </div>
</div>
<svg class="wave" viewBox="0 0 1440 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M0 60C240 100 480 20 720 60C960 100 1200 20 1440 60V120H0V60Z" fill="rgba(37,99,235,0.15)"/>
  <path d="M0 80C200 40 400 100 600 80C800 60 1000 100 1200 80L1440 80V120H0V80Z" fill="rgba(6,182,212,0.08)"/>
</svg>
</body>
</html>
